name: Build 华阳签 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate & Build
        working-directory: LCSignClone
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project HuaYangSign.xcodeproj \
            -scheme HuaYangSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          rm -rf Payload HuaYangSign.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr HuaYangSign.ipa Payload
          ls -lh HuaYangSign.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HuaYangSign-ipa
          path: LCSignClone/HuaYangSign.ipa
