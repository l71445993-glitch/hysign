name: Build 华阳签 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate & Build
        working-directory: LCSignClone
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project HuaYangSign.xcodeproj
          xcodebuild \
            -project HuaYangSign.xcodeproj \
            -scheme HuaYangSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload HuaYangSign.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr HuaYangSign.ipa Payload
          ls -lh HuaYangSign.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HuaYangSign-ipa
          path: LCSignClone/HuaYangSign.ipa
