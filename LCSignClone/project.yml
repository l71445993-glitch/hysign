name: HuaYangSign
options:
  bundleIdPrefix: com.huayang
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # 兼容 CI 上的 Xcode（避免 objectVersion 过高打不开）
  objectVersion: 56

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  HuaYangSign:
    type: application
    platform: iOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: LCSignClone
    info:
      path: LCSignClone/Resources/Info.plist
      properties:
        CFBundleDisplayName: 华阳签
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA Package
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huayang.sign
        PRODUCT_NAME: HuaYangSign
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
